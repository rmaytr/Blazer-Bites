0 3.4-.8 5' stroke='%23FFF3C4' stroke-width='1.7' stroke-linecap='round' fill='none'/%3E%3Cpath d='M12 41h40c0 8.2-7.6 13.4-20 13.4S12 49.2 12 41z' fill='%23FFFFFF'/%3E%3Cpath d='M12 41h40' stroke='%23FDB913' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M22 45.5c6.4 2 13.6 2 20 0' stroke='%231A5632' stroke-opacity='.18' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<title>Blazer Bites</title>
<style>
  :root {
    --bg: #F5F7F4; --ink: #0F1F17; --muted: #4E5C54; --surface: #FFFFFF; --line: #E1E7E0;
    --green: #1A5632; --gold: #FDB913; --on-gold: #033319;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .mark { display: block; width: 132px; height: 132px; margin: 0 auto 24px; filter: drop-shadow(0 16px 28px rgba(26, 86, 50, 0.3)); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 15px; margin: 0 0 32px; }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  a.choice {
    display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.choice:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -16px rgba(15, 31, 23, 0.25); }
  a.choice:active { transform: translateY(0); }
  .ic { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .ic.site { background: #EEF4F0; color: var(--green); }
  .ic.app { background: var(--gold); color: var(--on-gold); }
  .choice .t { flex: 1; min-width: 0; }
  .choice b { display: block; font-size: 16px; font-weight: 700; }
  .choice .t span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .choice .go { flex: 0 0 auto; color: var(--muted); font-size: 18px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Blazer Bites dragon eating a bowl of noodles"><defs>
      <linearGradient id="mark-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6B3E"/><stop offset="1" stop-color="#0E3A20"/></linearGradient>
      <linearGradient id="mark-scale" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD54F"/><stop offset="1" stop-color="#F4A30A"/></linearGradient>
      <linearGradient id="mark-horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7DC"/><stop offset="1" stop-color="#F2DFA8"/></linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#mark-bg)"/>
      <!-- horns, swept back -->
      <path d="M22.5 17.5C19 13 14.5 10.5 9 10.2c3.6 2.2 6.4 5.4 8.2 9.6z" fill="url(#mark-horn)"/>
      <path d="M28.5 15.6c-1.4-4.4-4.4-7.8-8.8-9.8 2.2 3 3.4 6.4 3.6 10.4z" fill="url(#mark-horn)"/>
      <!-- crest spikes down the back of the neck -->
      <path d="M12.6 22.4l-5 1.2 4 2.6-4.6 2.6 4.4 1.8-4 3.2 5 .6" fill="#E8590C"/>
      <!-- head and snout -->
      <path d="M11.6 36.8c-1.4-3-1.9-6.4-1.2-9.8 1.4-7.2 7.4-11.8 14.6-11.6 5.6.2 9.6 3 11.6 7.4l11.2 2.4c2.8.6 4.4 3.4 3.4 6l-.9 2.4c-.6 1.7-2.4 2.7-4.2 2.4l-10-1.6c-1.2.8-2.6 1.4-4.2 1.8z" fill="url(#mark-scale)"/>
      <!-- jaw line and cheek frill -->
      <path d="M35.8 33.2c3.6 1.4 7.6 1.8 11.4 1.2" stroke="#9A5200" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M21 33.6l-3.2 3.4 4.4-.4-1.6 3.2 4.2-2" fill="#E8590C"/>
      <!-- brow, closed happy eye, nostril -->
      <path d="M24.6 20.2l7.6-1.6" stroke="#E8590C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M25.2 24.4c1.6-1.8 4.4-1.9 6-.2" stroke="#0F2A1A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M46.2 26.6c.9-.4 1.9-.1 2.4.7" stroke="#9A5200" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- smoke puffs -->
      <path d="M52 21c-1.2-1.6-.8-3.4.8-4.4M55.6 22c-1.4-2.4-.6-5 1.8-6.2" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- noodles from mouth to bowl -->
      <path d="M39.4 34.2c-1.2 2-1 4.2.4 6.2M42.6 34.8c-.8 1.8-.6 3.6.6 5.4M45.6 34.8c.2 1.8 0 3.4-.8 5" stroke="#FFF3C4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- bowl -->
      <path d="M12 41h40c0 8.2-7.6 13.4-20 13.4S12 49.2 12 41z" fill="#FFFFFF"/>
      <path d="M12 41h40" stroke="#FDB913" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 45.5c6.4 2 13.6 2 20 0" stroke="#1A5632" stroke-opacity=".18" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <h1>Blazer Bites</h1>
    <p class="sub">Chef-quality lunch, between classes.</p>
    <div class="choices">
      <a class="choice" href="/site/" target="_blank" rel="noopener">
        <span class="ic site" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>
        </span>
        <span class="t"><b>Our website</b><span>The pitch — how it works, the numbers, the plan</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="choice" href="/app/" target="_blank" rel="noopener">
        <span class="ic app" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        </span>
        <span class="t"><b>Our app</b><span>Order ahead, pick a pickup window, track your order</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </div>
    <footer>A student venture proposal for UAB. Not affiliated with UAB Campus Dining or Sodexo.</footer>
  </div>
</body>
</html>
