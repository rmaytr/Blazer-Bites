<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="mark-bg" x1="0" y1="0" x2="0" y2="1"%3E%3Cstop offset="0" stop-color="#1F6B3E"/%3E%3Cstop offset="1" stop-color="#0F3D22"/%3E%3C/linearGradient%3E%3ClinearGradient id="mark-fire" x1="0" y1="1" x2="0" y2="0"%3E%3Cstop offset="0" stop-color="#F26B1D"/%3E%3Cstop offset="0.55" stop-color="#FDB913"/%3E%3Cstop offset="1" stop-color="#FFE27A"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="64" height="64" rx="16" fill="url%28#mark-bg%29"/%3E%3Cpath d="M33 6c2 7 10 9.5 10.5 19.5.6-2.2 2.2-3.8 4-4.5-.4 4.2 1.2 7.5.2 11.6-.6 2.3-1.7 3.9-2.7 3.9H18.6c-1.6-1.5-2.8-4.4-2.6-7.6.3-3.6 2.2-6 3.4-8.8.6 2.4 1.8 4 3.5 4.6-.6-8.6 8.8-11.6 10.1-18.7z" fill="url%28#mark-fire%29"/%3E%3Cpath d="M32.4 20.5c4.4 4.2 6.6 8.6 6 13.4-.2 1.2-.6 2.1-1 2.6H26.2c-.6-.8-1-1.9-1-3.3 0-3.4 2.4-5 3.5-7.4.6 1.2 1.4 2 2.4 2.4-.2-2.8.2-5.3 1.3-7.7z" fill="#FFE9A3"/%3E%3Cpath d="M12 36.5h40c0 9.7-7.9 16.5-20 16.5S12 46.2 12 36.5z" fill="#FFFFFF"/%3E%3Cpath d="M12 36.5h40" stroke="#FDB913" stroke-width="3" stroke-linecap="round"/%3E%3Cpath d="M24 53h16" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/%3E%3C/svg%3E">
<title>Blazer Bites</title>
<style>
  :root {
    --bg: #F5F7F4; --ink: #0F1F17; --muted: #4E5C54; --surface: #FFFFFF; --line: #E1E7E0;
    --green: #1A5632; --gold: #FDB913; --on-gold: #033319;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .mark { display: block; width: 72px; height: 72px; margin: 0 auto 20px; filter: drop-shadow(0 10px 18px rgba(26, 86, 50, 0.28)); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 15px; margin: 0 0 32px; }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  a.choice {
    display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.choice:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -16px rgba(15, 31, 23, 0.25); }
  a.choice:active { transform: translateY(0); }
  .ic { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .ic.site { background: #EEF4F0; color: var(--green); }
  .ic.app { background: var(--gold); color: var(--on-gold); }
  .choice .t { flex: 1; min-width: 0; }
  .choice b { display: block; font-size: 16px; font-weight: 700; }
  .choice .t span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .choice .go { flex: 0 0 auto; color: var(--muted); font-size: 18px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="mark-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6B3E"/><stop offset="1" stop-color="#0F3D22"/></linearGradient>
        <linearGradient id="mark-fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F26B1D"/><stop offset="0.55" stop-color="#FDB913"/><stop offset="1" stop-color="#FFE27A"/></linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#mark-bg)"/>
      <!-- A blazing flame rising out of a lunch bowl: the Blazers' fire, served between classes. -->
      <path d="M33 6c2 7 10 9.5 10.5 19.5.6-2.2 2.2-3.8 4-4.5-.4 4.2 1.2 7.5.2 11.6-.6 2.3-1.7 3.9-2.7 3.9H18.6c-1.6-1.5-2.8-4.4-2.6-7.6.3-3.6 2.2-6 3.4-8.8.6 2.4 1.8 4 3.5 4.6-.6-8.6 8.8-11.6 10.1-18.7z" fill="url(#mark-fire)"/>
      <path d="M32.4 20.5c4.4 4.2 6.6 8.6 6 13.4-.2 1.2-.6 2.1-1 2.6H26.2c-.6-.8-1-1.9-1-3.3 0-3.4 2.4-5 3.5-7.4.6 1.2 1.4 2 2.4 2.4-.2-2.8.2-5.3 1.3-7.7z" fill="#FFE9A3"/>
      <path d="M12 36.5h40c0 9.7-7.9 16.5-20 16.5S12 46.2 12 36.5z" fill="#FFFFFF"/>
      <path d="M12 36.5h40" stroke="#FDB913" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 53h16" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <h1>Blazer Bites</h1>
    <p class="sub">Chef-quality lunch, between classes.</p>
    <div class="choices">
      <a class="choice" href="/site/" target="_blank" rel="noopener">
        <span class="ic site" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>
        </span>
        <span class="t"><b>Our website</b><span>The pitch — how it works, the numbers, the plan</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
      <a class="choice" href="/app/" target="_blank" rel="noopener">
        <span class="ic app" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        </span>
        <span class="t"><b>Our app</b><span>Order ahead, pick a pickup window, track your order</span></span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </div>
    <footer>A student venture proposal for UAB. Not affiliated with UAB Campus Dining or Sodexo.</footer>
  </div>
</body>
</html>
